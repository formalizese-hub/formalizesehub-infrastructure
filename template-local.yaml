AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FormalizeSEHub - Template LOCAL (solo para sam local start-api, NO usar en deploy AWS)

# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANTE: Este template es SOLO para desarrollo local con SAM CLI.
# Nunca se sube a AWS. Para deploy usar template.yaml
# ─────────────────────────────────────────────────────────────────────────────

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Empresa-Id'"
      AllowOrigin: "'*'"
      MaxAge: "'7200'"
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Handler: index.handler
    Environment:
      Variables:
        DB_HOST: host.docker.internal
        DB_PORT: "5432"
        DB_NAME: formalizese
        DB_USER: postgres
        DB_PASSWORD: 3Q9Eg4EEZ54EY66d0ZkUGdqY
        DB_SSL_REJECT_UNAUTHORIZED: "false"
        ENVIRONMENT: local
        JWT_SECRET: f73eb9eb893b963f10e42a48e567670955aca705dca2a8d53694ce174112ae83
        SYSTEM_ORG_ID: "00000000-0000-0000-0000-000000000001"
        JWT_EXPIRATION_SECONDS: "28800"
        BCRYPT_ROUNDS: "10"
        ALLOWED_ORIGIN: "*"

Resources:

  FormalizeSEApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: FormalizeSEHub-API-local
      StageName: local
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Empresa-Id'"
        AllowOrigin: "'*'"
        MaxAge: "'7200'"
