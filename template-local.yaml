        AllowHeaders: "'Content-Type,Authorization,X-Empresa-Id'"
        AllowOrigin: "'*'"
        MaxAge: "'7200'"
      BinaryMediaTypes:
        - 'application/octet-stream'
        - 'multipart/form-data'
        - 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'

  # ── AUTH ──────────────────────────────────────────────────────────────────
